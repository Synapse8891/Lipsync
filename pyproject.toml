[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotoba-lipsync"
version = "0.1.0"
description = "Lightweight Japanese-first audio to viseme inference and OSC bridges"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "sounddevice>=0.5,<1", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
train = ["scikit-learn>=1.7,<2", "onnxruntime>=1.23,<2", "pyarrow>=17,<27", "requests>=2.32,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
kotoba-lipsync = "kotoba_lipsync.cli:main"

[tool.setuptools.packages.find]
include = ["kotoba_lipsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
